version: '3.8'

services:
  # MongoDB Service
  mongo:
    image: mongo:6.0
    container_name: svbh-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=svboys_hostel
    volumes:
      - mongo_data:/data/db
    networks:
      - svbh-network

  # Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: svbh-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/svboys_hostel
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - JWT_EXPIRATION_MS=86400000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    depends_on:
      - mongo
    networks:
      - svbh-network

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: svbh-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - svbh-network

networks:
  svbh-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
