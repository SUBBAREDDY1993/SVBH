# Sri Venkateswara Boys Hostel Management System Configuration

spring.application.name=hostel-management-backend
server.port=${PORT:${SERVER_PORT:8081}}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/svboys_hostel}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin Configuration (Created only if database has no users)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@svboyshostel.com}
app.admin.name=${ADMIN_NAME:Hostel Administrator}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.srivenkateswarahostel=INFO
logging.level.org.springframework.security=WARN

# Management 5-Day & 3-Day Fee Due Alerts Configuration
app.admin.alert.email=${ADMIN_ALERT_EMAIL:svbhostel2026@gmail.com}
app.admin.alert.mobile=${ADMIN_ALERT_MOBILE:8985010694}

# Spring Mail / SMTP Configuration (Live dispatch via Gmail / SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:svbhostel2026@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000


# SMS Gateway Configuration (Fast2SMS / Quick SMS)
# Enter Fast2SMS API Key from https://www.fast2sms.com to enable automatic SMS dispatch to resident mobile phones
app.sms.provider=${SMS_PROVIDER:FAST2SMS}
app.sms.api-key=${SMS_API_KEY:}
app.sms.sender-id=${SMS_SENDER_ID:SVBHST}

# Meta WhatsApp Cloud API Configuration
app.whatsapp.enabled=${WHATSAPP_ENABLED:true}
app.whatsapp.sandbox-mode=${WHATSAPP_SANDBOX_MODE:true}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:sandbox_access_token_svbh_2026}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:105948372619485}
app.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:102948573619284}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
app.whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:hostel_fee_reminder}
app.whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
app.whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:svbh_hostel_webhook_secret_2026}
app.whatsapp.max-retries=${WHATSAPP_MAX_RETRIES:3}
app.whatsapp.retry-delay-seconds=${WHATSAPP_RETRY_DELAY_SECONDS:60}



