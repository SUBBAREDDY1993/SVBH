# Sri Venkateswara Boys Hostel Management System Configuration

spring.application.name=hostel-management-backend
server.port=${SERVER_PORT:8081}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/svboys_hostel}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin Configuration (Created only if database has no users)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@svboyshostel.com}
app.admin.name=${ADMIN_NAME:Hostel Administrator}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.srivenkateswarahostel=INFO
logging.level.org.springframework.security=WARN
